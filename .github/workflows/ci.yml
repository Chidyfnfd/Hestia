name: CI/CD — Hestia

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── JOB 1: Tests + Build (se ejecuta en cada PR) ──────────
  build-and-test:
    name: Build, Lint y Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: www/package-lock.json

      - name: Instalar dependencias
        working-directory: www
        run: npm ci

      - name: Lint del código
        working-directory: www
        run: npm run lint

      - name: Build del proyecto
        working-directory: www
        run: npm run build

      - name: Pruebas unitarias e integración
        working-directory: www
        run: npm test -- --watchAll=false

      - name: Subir reporte de coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: www/coverage/

      - name: Instalar Playwright y browsers
        working-directory: www
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        working-directory: www
        run: npx playwright test

      - name: Subir reporte E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: www/playwright-report/

  # ── JOB 2: Deploy a Netlify (solo en merge a main) ────────
  deploy:
    name: Deploy a Netlify
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy a Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './www'
          production-branch: main
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}