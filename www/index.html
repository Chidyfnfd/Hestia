<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hestia - Gestión Económica</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- FontAwesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Ocultar barra de desplazamiento */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }

        /* Animaciones */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInBottom { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .animate-in.fade-in { animation: fadeIn var(--tw-duration, 500ms) ease-in-out forwards; }
        .animate-in.slide-in-from-bottom { animation: slideInBottom var(--tw-duration, 300ms) ease-out forwards; }
        .animate-in.zoom-in-95 { animation: zoomIn var(--tw-duration, 200ms) ease-out forwards; }
        
        .duration-200 { --tw-duration: 200ms; }
        .duration-300 { --tw-duration: 300ms; }
        .duration-500 { --tw-duration: 500ms; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ADAPTADOR DE ÍCONOS ---
        const IconWrapper = ({ icon, size = 24, className = '' }) => (
            <i className={`fas fa-${icon} ${className}`} style={{ fontSize: size, width: size, height: size, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}></i>
        );

        const Home = (p) => <IconWrapper icon="home" {...p} />;
        const PieChart = (p) => <IconWrapper icon="chart-pie" {...p} />;
        const Wallet = (p) => <IconWrapper icon="wallet" {...p} />;
        const Info = (p) => <IconWrapper icon="info-circle" {...p} />;
        const Plus = (p) => <IconWrapper icon="plus" {...p} />;
        const Calculator = (p) => <IconWrapper icon="calculator" {...p} />;
        const Moon = (p) => <IconWrapper icon="moon" {...p} />;
        const Sun = (p) => <IconWrapper icon="sun" {...p} />;
        const Edit2 = (p) => <IconWrapper icon="pen" {...p} />;
        const Trash2 = (p) => <IconWrapper icon="trash" {...p} />;
        const X = (p) => <IconWrapper icon="times" {...p} />;
        const Check = (p) => <IconWrapper icon="check" {...p} />;
        const Filter = (p) => <IconWrapper icon="filter" {...p} />;
        const BarChart2 = (p) => <IconWrapper icon="chart-bar" {...p} />;
        const TrendingUp = (p) => <IconWrapper icon="arrow-trend-up" {...p} />;
        const ChevronDown = (p) => <IconWrapper icon="chevron-down" {...p} />;
        const Settings = (p) => <IconWrapper icon="cog" {...p} />;
        const Tag = (p) => <IconWrapper icon="tag" {...p} />;
        const CreditCard = (p) => <IconWrapper icon="credit-card" {...p} />;
        const User = (p) => <IconWrapper icon="user" {...p} />;
        const Calendar = (p) => <IconWrapper icon="calendar" {...p} />;
        const DollarSign = (p) => <IconWrapper icon="dollar-sign" {...p} />;

        // --- CONFIGURACIÓN ---
        const APP_VERSION = '1.4.0'; // Versión actualizada
        const DEVELOPERS = 'Erika Milena Bernal Miranda y Juan Diego Quintero Zambrano';

        const DEFAULT_CATEGORIES = ['Servicios', 'Transporte', 'Comida', 'Hogar'];
        const DEFAULT_METHODS = ['Crédito', 'Efectivo', 'Ahorros', 'Débito', 'Transferencia'];
        const DEFAULT_RESPONSIBLES = ['Yo', 'Madre', 'Padre', 'Hijo', 'Abuelo'];

        // --- HOOK BASE DE DATOS ---
        const useLocalDB = (key, initialValue) => {
            const [data, setData] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });

            useEffect(() => {
                window.localStorage.setItem(key, JSON.stringify(data));
            }, [key, data]);

            return [data, setData];
        };

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            const [isLoading, setIsLoading] = useState(true);
            const [darkMode, setDarkMode] = useLocalDB('hestia_dark_mode', false);
            const [decimals, setDecimals] = useLocalDB('hestia_decimals', 0);
            const [appScale, setAppScale] = useLocalDB('hestia_scale', 16);
            const [activeTab, setActiveTab] = useState('inicio');
            const [showAbout, setShowAbout] = useState(false);
            const [logoHeaderError, setLogoHeaderError] = useState(false);

            // Datos
            const [expenses, setExpenses] = useLocalDB('hestia_expenses', []);
            const [funds, setFunds] = useLocalDB('hestia_funds', []);
            const [categories, setCategories] = useLocalDB('hestia_categories', DEFAULT_CATEGORIES);
            const [methods, setMethods] = useLocalDB('hestia_methods', DEFAULT_METHODS);
            const [responsibles, setResponsibles] = useLocalDB('hestia_responsibles', DEFAULT_RESPONSIBLES);

            // Estado global para modal de edición
            const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
            const [expenseToEdit, setExpenseToEdit] = useState(null);

            useEffect(() => {
                const timer = setTimeout(() => setIsLoading(false), 1500);
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const formatMoney = (val) => {
                return `$${Number(val).toLocaleString(undefined, { 
                    minimumFractionDigits: decimals, 
                    maximumFractionDigits: decimals 
                })}`;
            };

            const openExpenseModal = (expense = null) => {
                setExpenseToEdit(expense);
                setIsExpenseModalOpen(true);
            };

            const closeExpenseModal = () => {
                setExpenseToEdit(null);
                setIsExpenseModalOpen(false);
            };

            const handleSaveExpense = (expenseData) => {
                if (expenseToEdit) {
                    setExpenses(expenses.map(ex => 
                        ex.id === expenseData.id 
                            ? { ...expenseData, timestamp: ex.timestamp, lastModified: Date.now() } 
                            : ex
                    ));
                } else {
                    setExpenses([{ ...expenseData, timestamp: Date.now(), lastModified: Date.now() }, ...expenses]);
                }
                closeExpenseModal();
            };

            const handleDeleteExpense = (id) => {
                if(window.confirm('¿Desea eliminar este registro permanentemente?')) {
                    setExpenses(expenses.filter(ex => ex.id !== id));
                }
            };

            if (isLoading) return <LoadingScreen />;

            return (
                <div className={`min-h-screen bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 font-sans transition-colors duration-300 w-full flex justify-center`}>
                    <style>{`:root { font-size: ${appScale}px; }`}</style>
                    <div className="w-full max-w-md bg-white dark:bg-gray-900 shadow-2xl relative flex flex-col h-screen overflow-hidden">
                        
                        {/* CABECERA */}
                        <header className="flex justify-between items-center p-4 bg-[#E32636] text-white shadow-md z-10">
                            <div className="w-9"></div> 
                            <div className="flex-1 flex justify-center items-center">
                                {!logoHeaderError ? (
                                    <img src="LogoCabezaPag.png" alt="HESTIA Logo" onError={() => setLogoHeaderError(true)} className="h-8 object-contain" />
                                ) : (
                                    <h1 className="text-xl font-bold tracking-wider">HESTIA</h1>
                                )}
                            </div>
                            <div className="w-9"></div> 
                        </header>

                        {/* CONTENIDO */}
                        <main className="flex-1 overflow-y-auto pb-24 p-4 scrollbar-hide relative">
                            {activeTab === 'inicio' && (
                                <TabInicio 
                                    expenses={expenses}
                                    formatMoney={formatMoney}
                                    onEdit={openExpenseModal}
                                    onDelete={handleDeleteExpense}
                                    onAddNew={() => openExpenseModal()}
                                />
                            )}
                            {activeTab === 'historial' && (
                                <TabHistorial 
                                    expenses={expenses}
                                    categories={categories} methods={methods} responsibles={responsibles}
                                    formatMoney={formatMoney}
                                    onEdit={openExpenseModal}
                                    onDelete={handleDeleteExpense}
                                />
                            )}
                            {activeTab === 'capital' && (
                                <TabCapital 
                                    methods={methods} setMethods={setMethods}
                                    funds={funds} setFunds={setFunds}
                                    expenses={expenses} formatMoney={formatMoney}
                                />
                            )}
                            {activeTab === 'configuracion' && (
                                <TabConfiguracion 
                                    darkMode={darkMode} setDarkMode={setDarkMode}
                                    decimals={decimals} setDecimals={setDecimals}
                                    appScale={appScale} setAppScale={setAppScale}
                                    setShowAbout={setShowAbout}
                                />
                            )}
                        </main>

                        {/* NAVEGACIÓN */}
                        <nav className="absolute bottom-0 w-full bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 flex justify-around items-center p-2 z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] pb-safe">
                            <NavItem icon={<Home size={22} />} label="Inicio" isActive={activeTab === 'inicio'} onClick={() => setActiveTab('inicio')} />
                            <NavItem icon={<PieChart size={22} />} label="Historial" isActive={activeTab === 'historial'} onClick={() => setActiveTab('historial')} />
                            <NavItem icon={<Wallet size={22} />} label="Capital" isActive={activeTab === 'capital'} onClick={() => setActiveTab('capital')} />
                            <NavItem icon={<Settings size={22} />} label="Config" isActive={activeTab === 'configuracion'} onClick={() => setActiveTab('configuracion')} />
                        </nav>

                        {/* MODALES GLOBALES */}
                            {showAbout && (
                                <Modal title="Información" onClose={() => setShowAbout(false)}>
                                    <div className="flex flex-col items-center text-center space-y-4">
                                        {/* Imagen del Logo */}
                                        <img 
                                            src="logoinfo.png" 
                                            alt="Hestia Logo" 
                                            className="w-20 h-20 object-contain drop-shadow-lg"
                                        />
                                        
                                        <div>
                                            <h2 className="text-2xl font-bold text-gray-800 dark:text-white">Hestia</h2>
                                            <p className="text-sm text-gray-500 dark:text-gray-400">Gestión Económica</p>
                                        </div>
                                        
                                        <div className="w-full border-t border-gray-100 dark:border-gray-700 py-4 mt-2">
                                            <p className="text-gray-700 dark:text-gray-300"><strong>Versión:</strong> {APP_VERSION}</p>
                                            <p className="mt-1 text-gray-700 dark:text-gray-300"><strong>Desarrolladores:</strong><br/>{DEVELOPERS}</p>
                                        </div>
                                    </div>
                                </Modal>
                            )}

                        {isExpenseModalOpen && (
                            <ExpenseFormModal 
                                expense={expenseToEdit}
                                onSave={handleSaveExpense}
                                onClose={closeExpenseModal}
                                categories={categories} methods={methods} responsibles={responsibles}
                                setCategories={setCategories} setMethods={setMethods} setResponsibles={setResponsibles}
                            />
                        )}
                    </div>
                </div>
            );
        }

        // --- PANTALLA CARGA ---
        function LoadingScreen() {
            const [logoError, setLogoError] = useState(false);
            return (
                <div className="min-h-screen bg-[#E32636] flex flex-col items-center justify-center text-white w-full">
                    <div className="w-32 h-32 mb-6 bg-white rounded-3xl flex items-center justify-center shadow-2xl animate-pulse overflow-hidden p-2">
                        {!logoError ? (
                            <img src="logocarga.png" alt="Logo Carga" onError={() => setLogoError(true)} className="w-full h-full object-contain" />
                        ) : (
                            <span className="text-[#E32636] text-6xl font-black">H</span>
                        )}
                    </div>
                    <h1 className="text-4xl font-extrabold tracking-widest mb-10">HESTIA</h1>
                    <div className="w-48 h-2 bg-red-400/50 rounded-full overflow-hidden">
                        <div className="h-full bg-white animate-loading"></div>
                    </div>
                    <style>{`@keyframes loading { 0% { width: 0%; } 100% { width: 100%; } } .animate-loading { animation: loading 1.5s ease-in-out forwards; }`}</style>
                </div>
            );
        }

        function NavItem({ icon, label, isActive, onClick }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center p-2 transition-all duration-200 ${isActive ? 'text-[#E32636] scale-110' : 'text-gray-400 hover:text-gray-600 dark:text-gray-500'}`}>
                    {icon}
                    <span className="text-[10px] mt-1 font-bold">{label}</span>
                </button>
            );
        }

        // --- FORMULARIO DE GASTO COMPARTIDO ---
        function ExpenseFormModal({ expense, onSave, onClose, categories, methods, responsibles, setCategories, setMethods, setResponsibles }) {
            const [amount, setAmount] = useState(expense ? expense.amount.toString() : '');
            const [description, setDescription] = useState(expense ? expense.description : '');
            const [date, setDate] = useState(expense ? expense.date : new Date().toISOString().split('T')[0]);
            const [category, setCategory] = useState(expense ? expense.category : (categories[0] || ''));
            const [method, setMethod] = useState(expense ? expense.method : (methods[0] || ''));
            const [responsible, setResponsible] = useState(expense ? expense.responsible : (responsibles[0] || ''));
            const [showCalc, setShowCalc] = useState(false);

            useEffect(() => {
                if(!category && categories.length > 0) setCategory(categories[0]);
                if(!method && methods.length > 0) setMethod(methods[0]);
                if(!responsible && responsibles.length > 0) setResponsible(responsibles[0]);
            }, [categories, methods, responsibles, category, method, responsible]);

            const handleSubmit = (e) => {
                if (e) e.preventDefault();
                if (!amount || !description) return;

                onSave({
                    id: expense ? expense.id : Date.now().toString(),
                    amount: parseFloat(amount),
                    description,
                    date: date || new Date().toISOString().split('T')[0],
                    category: category || 'General',
                    method: method || 'Efectivo',
                    responsible: responsible || 'Yo'
                });
            };

            return (
                <div className="fixed inset-0 bg-black/70 z-[60] flex items-center justify-center backdrop-blur-sm p-4">
                    <div className="bg-white dark:bg-gray-900 w-full max-w-md rounded-3xl p-6 shadow-2xl animate-in zoom-in-95 duration-300 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-black dark:text-white flex items-center">
                                {expense ? <Edit2 className="mr-2 text-[#E32636]" size={20}/> : <Plus className="mr-2 text-[#E32636]" size={20}/>}
                                {expense ? 'Editar Gasto' : 'Nuevo Gasto'}
                            </h2>
                            <button onClick={onClose} className="p-2 bg-gray-100 dark:bg-gray-800 rounded-full text-gray-500">
                                <X size={20} />
                            </button>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="flex space-x-2">
                                <div className="flex-1 relative">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold">$</span>
                                    <input 
                                        type="number" step="0.01" inputMode="decimal"
                                        value={amount} onChange={(e) => setAmount(e.target.value)} 
                                        required placeholder="0.00" 
                                        className="w-full bg-gray-50 dark:bg-gray-800 border-2 border-transparent focus:border-[#E32636] rounded-2xl py-4 pl-8 pr-4 text-xl font-black outline-none dark:text-white transition-all" 
                                    />
                                </div>
                                <button type="button" onClick={() => setShowCalc(true)} className="bg-gray-100 dark:bg-gray-800 px-4 rounded-2xl text-[#E32636] border-2 border-transparent hover:border-[#E32636] transition-colors">
                                    <Calculator size={24} />
                                </button>
                            </div>

                            <input type="text" value={description} onChange={(e) => setDescription(e.target.value)} required placeholder="Descripción del gasto" className="w-full bg-gray-50 dark:bg-gray-800 border-2 border-transparent focus:border-[#E32636] rounded-2xl p-4 outline-none dark:text-white transition-colors" />
                            
                            <div className="relative">
                                <Calendar className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" size={18} />
                                <input 
                                    type="date" value={date} onChange={(e) => setDate(e.target.value)} 
                                    className="w-full bg-gray-50 dark:bg-gray-800 border-2 border-transparent focus:border-[#E32636] rounded-2xl p-4 pl-12 outline-none dark:text-white dark:[color-scheme:dark] transition-colors" 
                                />
                            </div>

                            <div className="flex gap-2 pt-2 w-full">
                                <div className="flex-1">
                                    <FancyDropdown label="Uso" icon={Tag} value={category} onChange={setCategory} options={categories} setOptions={setCategories} isCompact={true} />
                                </div>
                                <div className="flex-1">
                                    <FancyDropdown label="Método" icon={CreditCard} value={method} onChange={setMethod} options={methods} setOptions={setMethods} isCompact={true} />
                                </div>
                                <div className="flex-1">
                                    <FancyDropdown label="Resp." icon={User} value={responsible} onChange={setResponsible} options={responsibles} setOptions={setResponsibles} isCompact={true} />
                                </div>
                            </div>

                            <button type="submit" className="w-full bg-[#E32636] text-white font-black text-lg py-5 rounded-2xl shadow-xl hover:bg-red-700 active:scale-95 transition-all mt-4">
                                {expense ? 'ACTUALIZAR' : 'REGISTRAR'}
                            </button>
                        </form>
                    </div>
                    {showCalc && <CalculatorModal onResult={(val) => { setAmount(val.toString()); setShowCalc(false); }} onClose={() => setShowCalc(false)} />}
                </div>
            );
        }

        // --- PESTAÑA INICIO ---
        function TabInicio({ expenses, formatMoney, onEdit, onDelete, onAddNew }) {
            const [filterType, setFilterType] = useState('7days'); // '7days', 'added', 'edited'

            const listToDisplay = useMemo(() => {
                let list = [...expenses];
                if (filterType === '7days') {
                    const sevenDaysAgo = new Date();
                    sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                    list = list.filter(ex => new Date(ex.date) >= sevenDaysAgo).sort((a,b) => new Date(b.date) - new Date(a.date));
                } else if (filterType === 'added') {
                    list = list.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                } else if (filterType === 'edited') {
                    list = list.sort((a,b) => (b.lastModified || b.timestamp || 0) - (a.lastModified || a.timestamp || 0));
                }
                return list.slice(0, 10);
            }, [expenses, filterType]);

            return (
                <div className="space-y-6 animate-in fade-in duration-500 h-full relative">
                    <div className="bg-white dark:bg-gray-800 rounded-3xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 min-h-[40vh]">
                        <div className="flex justify-between items-center mb-4">
                            <div className="font-bold text-gray-800 dark:text-white flex items-center text-lg w-full">
                                <Calendar className="mr-2 text-[#E32636]" size={20}/> 
                                <div className="relative flex-1">
                                    <select 
                                        value={filterType} 
                                        onChange={e => setFilterType(e.target.value)}
                                        className="w-full appearance-none bg-transparent border-none text-gray-800 dark:text-white outline-none cursor-pointer focus:ring-0 truncate pr-8"
                                    >
                                        <option value="7days" className="text-black">Recientes (7 días)</option>
                                        <option value="added" className="text-black">Últimos Agregados</option>
                                        <option value="edited" className="text-black">Últimos Editados</option>
                                    </select>
                                    <ChevronDown size={14} className="absolute right-0 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none" />
                                </div>
                            </div>
                        </div>
                        
                        {listToDisplay.length === 0 ? (
                            <div className="flex flex-col items-center justify-center text-gray-400 py-10 opacity-50">
                                <Check size={48} className="mb-2" />
                                <p className="text-sm">Sin gastos registrados.</p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {listToDisplay.map(ex => (
                                    <div key={ex.id} className="flex justify-between items-center p-3 bg-gray-50 dark:bg-gray-900/50 rounded-2xl border border-gray-100 dark:border-gray-700 hover:shadow-md transition-shadow">
                                        <div className="flex-1 overflow-hidden pr-2">
                                            <p className="font-bold text-sm text-gray-800 dark:text-gray-200 truncate">{ex.description}</p>
                                            <p className="text-[10px] text-gray-500 dark:text-gray-400 mt-0.5 font-medium uppercase tracking-wider">
                                                {ex.date} • {ex.category}
                                            </p>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <span className="font-extrabold text-[#E32636] whitespace-nowrap">{formatMoney(ex.amount)}</span>
                                            <div className="flex gap-1">
                                                <button onClick={() => onEdit(ex)} className="p-1.5 text-gray-400 hover:text-blue-500 bg-white dark:bg-gray-800 rounded-lg shadow-sm"><Edit2 size={14}/></button>
                                                <button onClick={() => onDelete(ex.id)} className="p-1.5 text-gray-400 hover:text-[#E32636] bg-white dark:bg-gray-800 rounded-lg shadow-sm"><Trash2 size={14}/></button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-24 right-6 z-20">
                        <button onClick={onAddNew} className="bg-[#E32636] text-white p-4 rounded-full shadow-2xl hover:bg-red-700 hover:scale-110 transition-all active:scale-95">
                            <Plus size={32} />
                        </button>
                    </div>
                </div>
            );
        }

        // --- PESTAÑA HISTORIAL ---
        function TabHistorial({ expenses, categories, methods, responsibles, formatMoney, onEdit, onDelete }) {
            const [timeFilter, setTimeFilter] = useState('mes');
            const [chartType, setChartType] = useState('torta');
            
            const [catFilter, setCatFilter] = useState('Todos');
            const [methodFilter, setMethodFilter] = useState('Todos');
            const [respFilter, setRespFilter] = useState('Todos');
            const [dateRange, setDateRange] = useState({ start: '', end: '' });
            const [showFilters, setShowFilters] = useState(false);

            const filteredData = useMemo(() => {
                let data = expenses;
                const now = new Date();

                if (timeFilter !== 'historico') {
                    data = data.filter(ex => {
                        const d = ex.date ? new Date(ex.date) : new Date();
                        if (timeFilter === 'año') return d.getFullYear() === now.getFullYear();
                        if (timeFilter === 'mes') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                        if (timeFilter === 'semana') {
                            const pastWeek = new Date(now); pastWeek.setDate(now.getDate() - 7);
                            return d >= pastWeek;
                        }
                        if (timeFilter === 'dia') return d.toDateString() === now.toDateString();
                        return true;
                    });
                }

                if (methodFilter !== 'Todos') data = data.filter(ex => ex.method === methodFilter);
                if (respFilter !== 'Todos') data = data.filter(ex => ex.responsible === respFilter);

                return data.sort((a, b) => new Date(b.date) - new Date(a.date));

        // --- CALCULADORA ADAPTABLE ---
        function CalculatorModal({ onResult, onClose }) {
            const [mode, setMode] = useState('simple'); 
            const [calc, setCalc] = useState('0');
            const [memory, setMemory] = useState(0);
            const [gt, setGt] = useState(0);

            const evaluateStr = (expr) => {
                try {
                    const parsed = expr.replace(/x/g, '*').replace(/÷/g, '/');
                    const res = new Function('return ' + parsed)();
                    return Number.isFinite(res) ? Math.round(res * 10000) / 10000 : 0;
                } catch {
                    return 0;
                }
            };

            const handle = (v) => {
                if (v === 'AC') { setCalc('0'); setGt(0); setMemory(0); return; }
                if (v === '⌫') { setCalc(calc.length > 1 ? calc.slice(0, -1) : '0'); return; }
                if (v === '=') { const res = evaluateStr(calc); setGt(gt + res); setCalc(res.toString()); return; }
                if (v === 'M+') { setMemory(memory + evaluateStr(calc)); return; }
                if (v === 'M-') { setMemory(memory - evaluateStr(calc)); return; }
                if (v === 'MRC') { setCalc(calc === '0' ? memory.toString() : calc + memory.toString()); return; }
                if (v === 'GT') { setCalc(calc === '0' ? gt.toString() : calc + gt.toString()); return; }
                if (v === '√') { const res = evaluateStr(calc); setCalc((res >= 0 ? Math.sqrt(res) : 0).toString()); return; }
                if (v === '%') { const res = evaluateStr(calc); setCalc((res / 100).toString()); return; }

                if (calc === '0' && !['.', '00', '000', '+', '-', 'x', '÷'].includes(v)) setCalc(v);
                else setCalc(calc + v);
            };

            const simpleKeys = [
                { id: 'AC', class: 'text-[#E32636] bg-red-50 dark:bg-red-900/20' }, { id: '⌫', class: 'text-[#E32636] bg-red-50 dark:bg-red-900/20' }, { id: '%', class: 'text-[#E32636] bg-red-50 dark:bg-red-900/20' }, { id: '÷', class: 'text-white bg-[#E32636] shadow-md' },
                { id: '7', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '8', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '9', class: 'bg-gray-50 dark:bg-gray-800' }, { id: 'x', class: 'text-white bg-[#E32636] shadow-md' },
                { id: '4', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '5', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '6', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '-', class: 'text-white bg-[#E32636] shadow-md' },
                { id: '1', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '2', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '3', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '+', class: 'text-white bg-[#E32636] shadow-md' },
                { id: '0', class: 'bg-gray-50 dark:bg-gray-800 col-span-2' }, { id: '.', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '=', class: 'text-white bg-[#E32636] shadow-md' }
            ];

            const financeKeys = [
                { id: 'GT', class: 'text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800' }, { id: 'M+', class: 'text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800' }, { id: 'M-', class: 'text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800' }, { id: 'MRC', class: 'text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800' },
                { id: 'AC', class: 'text-[#E32636] bg-red-50 dark:bg-red-900/20' }, { id: '⌫', class: 'text-[#E32636] bg-red-50 dark:bg-red-900/20' }, { id: '√', class: 'text-[#E32636] bg-red-50 dark:bg-red-900/20' }, { id: '÷', class: 'text-white bg-[#E32636] shadow-md' },
                { id: '7', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '8', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '9', class: 'bg-gray-50 dark:bg-gray-800' }, { id: 'x', class: 'text-white bg-[#E32636] shadow-md' },
                { id: '4', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '5', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '6', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '-', class: 'text-white bg-[#E32636] shadow-md' },
                { id: '1', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '2', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '3', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '+', class: 'text-white bg-[#E32636] shadow-md row-span-2' },
                { id: '0', class: 'bg-gray-50 dark:bg-gray-800' }, { id: '00', class: 'bg-gray-50 dark:bg-gray-800 text-sm' }, { id: '.', class: 'bg-gray-50 dark:bg-gray-800' },
            ];

            const activeKeys = mode === 'simple' ? simpleKeys : financeKeys;

            return (
                <div className="fixed inset-0 bg-black/70 z-[70] flex items-center justify-center p-3 sm:p-4 backdrop-blur-sm animate-in fade-in duration-300">
                    <div className="bg-white dark:bg-gray-900 w-full max-w-sm rounded-3xl p-4 sm:p-6 shadow-2xl relative overflow-hidden flex flex-col">
                        
                        <div className="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-2xl mb-4 relative z-10 shadow-inner">
                            <button onClick={() => setMode('simple')} className={`flex-1 py-2.5 text-xs font-black uppercase tracking-wider rounded-xl transition-all ${mode === 'simple' ? 'bg-white dark:bg-gray-700 text-[#E32636] shadow-md' : 'text-gray-500'}`}>Simple</button>
                            <button onClick={() => setMode('finance')} className={`flex-1 py-2.5 text-xs font-black uppercase tracking-wider rounded-xl transition-all ${mode === 'finance' ? 'bg-white dark:bg-gray-700 text-[#E32636] shadow-md' : 'text-gray-500'}`}>Finanzas</button>
                        </div>

                        {/* Display Mejorado - Wrap completo */}
                        <div className="bg-gray-50 dark:bg-gray-800 border-2 border-transparent focus-within:border-[#E32636] p-4 rounded-3xl mb-4 flex flex-col justify-between shadow-inner relative transition-colors h-32 overflow-hidden">
                            <div className="flex justify-between items-center mb-1 h-4 flex-shrink-0">
                                <div className="flex space-x-2 text-[10px] font-black text-gray-400">
                                    {memory !== 0 && <span className="bg-gray-200 dark:bg-gray-700 px-1.5 py-0.5 rounded-md">M</span>}
                                    {gt !== 0 && <span className="bg-gray-200 dark:bg-gray-700 px-1.5 py-0.5 rounded-md">GT</span>}
                                </div>
                                {mode === 'finance' && <div className="text-[9px] font-black text-gray-400 tracking-widest uppercase">Financiera</div>}
                            </div>
                            <div 
                                className="text-gray-900 dark:text-white text-right overflow-y-auto break-all font-black tracking-tighter w-full max-h-full scrollbar-hide flex flex-col justify-end"
                                style={{ 
                                    fontSize: calc.length > 22 ? '1.3rem' : calc.length > 12 ? '1.7rem' : '2.25rem',
                                    lineHeight: '1.2' 
                                }}
                            >
                                {calc}
                            </div>
                        </div>

                        <div className="grid grid-cols-4 gap-2 sm:gap-3 mb-4">
                            {activeKeys.map((k, i) => (
                                <button key={i} onClick={() => handle(k.id)} className={`rounded-2xl shadow-sm flex items-center justify-center font-black text-xl active:scale-90 transition-all py-3 sm:py-4 hover:brightness-95 dark:hover:brightness-110 dark:text-white ${k.class}`}>{k.id}</button>
                            ))}
                            {mode === 'finance' && (
                                <button onClick={() => handle('=')} className="col-span-4 rounded-2xl shadow-md flex items-center justify-center font-black text-xl active:scale-90 transition-all py-3 sm:py-4 text-white bg-[#E32636] hover:bg-red-700">=</button>
                            )}
                        </div>

                        <div className="flex gap-3 pt-2 border-t border-gray-100 dark:border-gray-800">
                            <button onClick={onClose} className="bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 px-4 py-4 rounded-2xl font-bold flex-1 transition-colors hover:bg-gray-200 dark:hover:bg-gray-700">Cancelar</button>
                            <button onClick={() => onResult(evaluateStr(calc))} className="bg-[#E32636] text-white px-4 py-4 rounded-2xl font-black flex-1 shadow-lg hover:bg-red-700 transition-colors active:scale-95">Usar Valor</button>
                        </div>

                    </div>
                </div>
            );
        }

        // --- GRÁFICOS AVANZADOS ---
        function CustomPieChart({ data, colors, total }) {
            let acc = 0;
            const stops = data.map((d, i) => {
                const p = (d.value / total) * 100;
                const s = acc; acc += p;
                return `${colors[i % colors.length]} ${s}% ${acc}%`;
            }).join(', ');

            return (
                <div className="flex w-full h-full items-center justify-between">
                    <div className="relative w-32 h-32 rounded-full shadow-inner border-4 border-white dark:border-gray-800 flex-shrink-0" style={{ background: `conic-gradient(${stops})` }}>
                        <div className="absolute inset-5 bg-white dark:bg-gray-800 rounded-full flex flex-col items-center justify-center text-center shadow-lg">
                            <span className="text-[8px] font-black text-gray-400 uppercase tracking-tighter">TOTAL</span>
                            <span className="font-black text-sm dark:text-white leading-none">{total > 9999 ? (total/1000).toFixed(1)+'k' : total.toFixed(0)}</span>
                        </div>
                    </div>
                    <div className="flex flex-col justify-center space-y-2 ml-4 flex-1 h-32 overflow-y-auto scrollbar-hide pr-1">
                        {data.map((d, i) => (
                            <div key={d.label} className="flex items-center text-xs w-full">
                                <span className="w-3 h-3 rounded-full mr-2 flex-shrink-0" style={{ backgroundColor: colors[i % colors.length] }}></span>
                                <div className="flex-1 truncate dark:text-gray-300 mr-1" title={d.label}>{d.label}</div>
                                <span className="font-bold dark:text-white">{((d.value/total)*100).toFixed(0)}%</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function CustomBarChart({ data, colors, max, formatMoney }) {
            return (
                <div className="w-full h-full relative pt-4 pb-6 pl-4 pr-2">
                    {/* Ejes (X e Y) */}
                    <div className="absolute left-4 right-2 bottom-6 top-4 border-l-2 border-b-2 border-gray-300 dark:border-gray-600 pointer-events-none"></div>
                    
                    <div className="w-full h-full flex items-end justify-around gap-2 px-2 relative z-10">
                        {data.map((d, i) => {
                            const h = max === 0 ? 0 : (d.value / max) * 100;
                            return (
                                <div key={d.label} className="flex-1 flex flex-col items-center h-full justify-end relative group cursor-pointer">
                                    {/* Tooltip al pasar el mouse (o tap) */}
                                    <div className="absolute -top-7 bg-gray-800 text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity z-10 whitespace-nowrap pointer-events-none shadow-md">
                                        {formatMoney(d.value)}
                                    </div>
                                    <div className="w-full max-w-[24px] rounded-t-md transition-all duration-1000 shadow-sm" style={{ height: `${h}%`, backgroundColor: colors[i % colors.length] }}></div>
                                    <div className="absolute -bottom-6 w-16 text-center">
                                        <span className="text-[8px] text-gray-500 font-bold truncate block">{d.label}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function CustomLineChart({ data }) {
            const grouped = useMemo(() => {
                const d = {}; data.forEach(ex => { const dt = ex.date; d[dt] = (d[dt] || 0) + ex.amount; });
                return Object.keys(d).sort((a,b) => new Date(a)-new Date(b)).map(k => ({k, v: d[k]}));
            }, [data]);

            if (grouped.length < 2) return <div className="text-gray-400 text-xs flex items-center h-full pb-4">Datos insuficientes (Mín. 2 fechas) para la tendencia.</div>;

            const max = Math.max(...grouped.map(g => g.v));
            const paddedMax = max * 1.1; // Margen superior
            
            const w = 250, h = 100;
            const pts = grouped.map((g, i) => {
                const x = (i / (grouped.length - 1)) * w;
                const y = h - (g.v / (paddedMax || 1)) * h;
                return `${x},${y}`;
            }).join(' ');

            const polyPts = `0,${h} ${pts} ${w},${h}`;
            
            // Submuestreo dinámico de etiquetas en X para evitar solapamientos visuales
            const showLabelEvery = Math.ceil(grouped.length / 5);

            return (
                <div className="w-full h-full pt-4 pl-2 pr-2">
                    <svg viewBox={`-10 -10 ${w + 20} ${h + 30}`} className="w-full h-full overflow-visible">
                        <defs>
                            <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#E32636" stopOpacity="0.4" />
                                <stop offset="100%" stopColor="#E32636" stopOpacity="0.0" />
                            </linearGradient>
                        </defs>
                        
                        {/* Ejes X e Y */}
                        <line x1="0" y1="0" x2="0" y2={h} stroke="currentColor" strokeWidth="2" className="text-gray-300 dark:text-gray-600" />
                        <line x1="0" y1={h} x2={w} y2={h} stroke="currentColor" strokeWidth="2" className="text-gray-300 dark:text-gray-600" />

                        <polygon points={polyPts} fill="url(#areaGradient)" />
                        <polyline fill="none" stroke="#E32636" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" points={pts} />
                        {grouped.map((g, i) => {
                            const x = (i / (grouped.length - 1)) * w;
                            const y = h - (g.v / (paddedMax || 1)) * h;
                            return (
                                <g key={i}>
                                    <circle cx={x} cy={y} r="4" fill="#E32636" stroke="white" strokeWidth="2" />
                                    {i % showLabelEvery === 0 && (
                                        <text x={x} y={h + 18} fontSize="9" fill="gray" textAnchor="middle" fontWeight="bold">
                                            {g.k.substring(5).replace('-', '/')}
                                        </text>
                                    )}
                                </g>
                            );
                        })}
                    </svg>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
