<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hestia - Gestión Económica</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <!-- Tailwind CSS (compilado estáticamente, sin conexión) -->
    <link rel="stylesheet" href="vendor/tailwind.css">

    <!-- FontAwesome (local) -->
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">

    <!-- React y ReactDOM (local, build de producción) -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>

    <style>
        /* Ocultar barra de desplazamiento */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }

        /* Animaciones */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInBottom { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .animate-in.fade-in { animation: fadeIn var(--tw-duration, 500ms) ease-in-out forwards; }
        .animate-in.slide-in-from-bottom { animation: slideInBottom var(--tw-duration, 300ms) ease-out forwards; }
        .animate-in.zoom-in-95 { animation: zoomIn var(--tw-duration, 200ms) ease-out forwards; }
        
        .duration-200 { --tw-duration: 200ms; }
        .duration-300 { --tw-duration: 300ms; }
        .duration-500 { --tw-duration: 500ms; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950">
    <div id="root"></div>

    <script src="vendor/app.js"></script>
</body>
</html>
